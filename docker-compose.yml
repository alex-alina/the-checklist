version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: checklist
      POSTGRES_PASSWORD: checklist
      POSTGRES_DB: checklist
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
